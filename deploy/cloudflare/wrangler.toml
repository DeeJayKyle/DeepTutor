# Cloudflare Worker in front of the Render service (see worker.js).
# Deployed by .github/workflows/deploy-cloudflare.yml.
name = "tutor-companion"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
UPSTREAM = "https://deeptutor-ia8s.onrender.com"

# Deep Tutor Pro's web build (downloaded from its latest GitHub release by the
# deploy workflow) is served from here at /pro/.
[assets]
directory = "./public"
