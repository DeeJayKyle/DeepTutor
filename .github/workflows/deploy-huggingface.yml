name: Deploy to Hugging Face

# Publishes DeepTutor as a free Hugging Face Docker Space.
# Setup: deploy/huggingface/SETUP.md

on:
  push:
    branches: [main]
    paths:
      - "deploy/huggingface/**"
      - "web/**"
      - ".github/workflows/deploy-huggingface.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-huggingface
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face client
        run: python -m pip install "huggingface_hub>=0.30,<2"

      - name: Create or update the Space
        run: python deploy/huggingface/deploy.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATA_TOKEN: ${{ secrets.HF_DATA_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
          HF_DATA_REPO: ${{ vars.HF_DATA_REPO }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          DATA_SYNC_MINUTES: ${{ vars.DATA_SYNC_MINUTES }}
