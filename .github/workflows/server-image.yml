name: Build server image

# Builds the online DeepTutor server image and publishes it to GitHub
# Container Registry as ghcr.io/<owner>/deeptutor-online.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "deploy/server/**"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deeptutor-online" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Online DeepTutor server
          cache-from: type=gha
          cache-to: type=gha,mode=max
