name: Keep server awake

# Render's free service sleeps after 15 minutes without visits and then takes
# minutes to start again, which phones on mobile data often give up on. A
# light request every 10 minutes keeps it running (one always-on free service
# fits Render's 750 free hours a month).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/cloudflare
      - name: Ping the server
        run: |
          upstream="$(grep -E '^UPSTREAM' deploy/cloudflare/wrangler.toml | cut -d'"' -f2)"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 240 "$upstream/companion/manifest.json" || true)
          echo "$upstream -> HTTP $code"

      - name: Finish the Cloudflare setup once its token is added
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "No Cloudflare token yet."; exit 0; }
          url="$(python3 deploy/cloudflare/app_url.py)"
          case "$url" in *workers.dev) ;; *) echo "Cloudflare address not available yet."; exit 0 ;; esac
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url/companion/manifest.json" || true)
          echo "$url -> HTTP $code"
          # 404 = the Worker has never been deployed: deploy it now.
          if [ "$code" = "404" ]; then
            gh workflow run deploy-cloudflare.yml --ref main --repo "$GITHUB_REPOSITORY"
            echo "Started Deploy to Cloudflare."
          fi

      - name: Publish a new Deep Tutor Pro web release at /pro/
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRO_REPO: ${{ vars.PRO_REPO || 'DeeJayKyle/Deep-Tutor-Pro' }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || exit 0
          latest="$(gh release view --repo "$PRO_REPO" --json tagName,assets -q 'select([.assets[].name | startswith("deep-tutor-pro-web-")] | any) | .tagName' 2>/dev/null || true)"
          [ -n "$latest" ] || { echo "No Deep Tutor Pro web release yet."; exit 0; }
          url="$(python3 deploy/cloudflare/app_url.py)"
          live="$(curl -s --max-time 60 "$url/pro/RELEASE.txt" || true)"
          echo "Deep Tutor Pro: latest $latest, live '${live}'"
          if [ "$live" != "$latest" ] && ! gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-cloudflare.yml --status in_progress --json databaseId -q '.[0].databaseId' | grep -q .; then
            gh workflow run deploy-cloudflare.yml --ref main --repo "$GITHUB_REPOSITORY"
            echo "Started Deploy to Cloudflare for Deep Tutor Pro $latest."
          fi
