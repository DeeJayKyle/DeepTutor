name: Release Tutor Companion

# Builds the Windows installer, checks the live site, and publishes a GitHub
# release tagged companion-v<version> with release notes from
# .github/release-notes/companion-<version>.md.
#
# The tag deliberately does not start with "v": upstream DeepTutor's PyPI and
# Docker release workflows only act on v* tags, so they skip this release.
# Run from Actions → Release Tutor Companion → Run workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: companion-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  live-check:
    name: Check the live site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for /companion on the deployed server
        run: |
          url="${{ vars.COMPANION_URL }}"
          [ -n "$url" ] || url="$(python3 -c "import json;print(json.load(open('apps/companion-desktop/config.json'))['serverUrl'])")"
          echo "Checking $url (free Render services can take a minute to wake up)"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url/companion/manifest.json" || true)
            if [ "$code" = "200" ]; then break; fi
            echo "attempt $i: HTTP $code"; sleep 20
          done
          [ "$code" = "200" ] || { echo "::error::$url/companion is not reachable"; exit 1; }
          curl -sf "$url/companion/manifest.json" | grep -q '"Tutor Companion"'
          curl -sf -o /dev/null "$url/companion/js/app.js"
          curl -sf -o /dev/null "$url/companion/vendor/docx.iife.js"
          page=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "$url/companion")
          echo "/companion -> $page"
          echo "### Live site" >> "$GITHUB_STEP_SUMMARY"
          echo "Tutor Companion is served at $url/companion" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/companion-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/companion-desktop/package-lock.json
      - run: npm ci
      - name: Set version and server address
        shell: bash
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          if [ -n "${{ vars.COMPANION_URL }}" ]; then
            node -e "const f='config.json';const c=require('./'+f);c.serverUrl=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "${{ vars.COMPANION_URL }}"
          fi
          cat config.json
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/companion-desktop/dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [live-check, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets
      - name: Package the web app for self-hosting
        run: |
          (cd web/public && zip -qr "../../release-assets/Tutor-Companion-Web-${{ inputs.version }}.zip" companion)
          (cd release-assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="companion-v${{ inputs.version }}"
          notes=".github/release-notes/companion-${{ inputs.version }}.md"
          [ -f "$notes" ] || { echo "::error::Missing $notes"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" \
              --title "Tutor Companion ${{ inputs.version }}" --notes-file "$notes" --latest
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
