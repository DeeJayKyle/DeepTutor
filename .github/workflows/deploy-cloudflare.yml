name: Deploy to Cloudflare

# Publishes the Cloudflare Worker that serves the app from a Cloudflare
# address (reachable on mobile networks that fail to open *.onrender.com).
# Needs the repository secret CLOUDFLARE_API_TOKEN (CLOUDFLARE_ACCOUNT_ID optional).
# Setup: deploy/README.md

on:
  push:
    branches: [main]
    paths:
      - "deploy/cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping. See deploy/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The account ID is optional: it is looked up from the token.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            id="$(python3 deploy/cloudflare/app_url.py --account-id)"
            [ -n "$id" ] || { echo "::error::The Cloudflare token cannot see any account."; exit 1; }
            echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Add the Deep Tutor Pro web app (served at /pro/)
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRO_REPO: ${{ vars.PRO_REPO || 'DeeJayKyle/Deep-Tutor-Pro' }}
        run: |
          out=deploy/cloudflare/public
          mkdir -p "$out" /tmp/pro
          tag="$(gh release view --repo "$PRO_REPO" --json tagName -q .tagName 2>/dev/null || true)"
          if [ -n "$tag" ] && gh release download "$tag" --repo "$PRO_REPO" --pattern 'deep-tutor-pro-web-*.zip' --dir /tmp/pro 2>/dev/null; then
            unzip -q /tmp/pro/*.zip -d "$out/pro"
            echo "$tag" > "$out/pro/RELEASE.txt"
            echo "Deep Tutor Pro $tag added at /pro/." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Deep Tutor Pro web build published yet." | tee "$out/pro-not-published.txt"
          fi

      - name: Deploy the Worker
        if: steps.check.outputs.ready == 'true'
        working-directory: deploy/cloudflare
        run: npx --yes wrangler@4.151.0 deploy

      - name: Check the app through Cloudflare
        if: steps.check.outputs.ready == 'true'
        run: |
          url="$(python3 deploy/cloudflare/app_url.py)"
          echo "App address: $url/companion"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url/companion/manifest.json" || true)
            [ "$code" = "200" ] && break
            echo "attempt $i: HTTP $code (the server may be waking up)"; sleep 20
          done
          [ "$code" = "200" ] || { echo "::error::$url/companion is not reachable"; exit 1; }
          {
            echo "### Tutor Companion is served through Cloudflare"
            echo ""
            echo "- App: $url/companion"
            echo "- DeepTutor: $url/"
            [ -f deploy/cloudflare/public/pro/index.html ] && echo "- Deep Tutor Pro: $url/pro/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the Tutor Companion 1.0 release (first time only)
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(gh release view companion-v1.0.0 --repo "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null || true)"
          if [ "$title" = "Tutor Companion 1.0" ]; then
            echo "Release already published."
          else
            gh workflow run companion-release.yml --ref main --repo "$GITHUB_REPOSITORY" \
              -f version=1.0.0 -f title="Tutor Companion 1.0" -f replace=true
            echo "Started Release Tutor Companion (apps now point at the Cloudflare address)." >> "$GITHUB_STEP_SUMMARY"
          fi
