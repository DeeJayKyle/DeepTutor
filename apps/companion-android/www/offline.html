<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tutor Companion — connect once</title>
  <style>
    body { font: 15px/1.6 system-ui, "Segoe UI", sans-serif; background: #f5f7fa; color: #1c2430; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    main { max-width: 520px; background: #fff; border: 1px solid #d8dfe8; border-radius: 12px; padding: 28px 32px; }
    h1 { color: #1f4e79; font-size: 1.4rem; margin-top: 0; }
    button { background: #1f4e79; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; cursor: pointer; }
    code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Connect to the internet once</h1>
    <p>Tutor Companion could not reach <code id="server"></code>.</p>
    <p>The first time you use the app it needs an internet connection so you can sign in and it can store itself on this computer. After that it opens and works offline.</p>
    <p>If the server was asleep, it can take up to a minute to wake up.</p>
    <button onclick="location.href = SERVER + '/companion/index.html'">Try again</button>
  </main>
  <script>
    var SERVER = "https://deeptutor-ia8s.onrender.com";
    document.getElementById("server").textContent = SERVER;
  </script>
</body>
</html>
